{% extends "base.html" %}
{% block title %}上传演示文稿{% endblock %}
{% block body %}
<main class="center-page">
    <section class="card">
        <div class="card-header">
            <div>
                <h1>上传 PDF</h1>
                <p class="muted">上传新文件会替换当前展示的 PDF。</p>
            </div>
            <form method="post" action="{{ url_for('admin_logout') }}">
                <button class="text-button" type="submit">退出</button>
            </form>
        </div>

        {% include "flash_messages.html" %}

        <form method="post" enctype="multipart/form-data" class="form-stack">
            <label for="pdf">选择 PDF 文件</label>
            <input id="pdf" name="pdf" type="file" accept="application/pdf,.pdf" required>
            <small>最大 100 MB。带有文字层的 PDF 支持选择、搜索和复制文字。</small>
            <button class="button" type="submit">上传并替换</button>
        </form>

        <div class="status-row">
            <span>当前状态：{{ "已发布" if pdf_exists else "尚未发布" }}</span>
            <a href="{{ url_for('index') }}" target="_blank" rel="noopener">查看前台</a>
        </div>
    </section>
</main>
{% endblock %}
