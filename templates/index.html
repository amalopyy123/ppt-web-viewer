{% extends "base.html" %}
{% block title %}PDF Viewer{% endblock %}
{% block body %}
<main class="viewer-page">
    <header class="viewer-header">
        <h1>PDF Document</h1>
        {% if pdf_exists %}<a class="button secondary" href="{{ url_for('pdf_viewer') }}">Open Viewer</a>{% endif %}
    </header>
    {% if pdf_exists %}
        <iframe class="pdf-viewer" src="{{ url_for('pdf_viewer') }}" title="PDF Document"></iframe>
    {% else %}
        <section class="empty-state"><h2>No document yet</h2><p>An administrator must upload a PDF first.</p></section>
    {% endif %}
</main>
{% endblock %}
